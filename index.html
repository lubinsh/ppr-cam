<!DOCTYPE html>
<html lang="lv" class="h-full bg-slate-950 text-white">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PPR Mobilā Kamera</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
</head>
<body class="h-full flex flex-col justify-between p-4 selection:bg-indigo-500/20 antialiased font-sans">

  <!-- Galvene -->
  <header class="flex items-center justify-between pb-3 border-b border-slate-800">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-bold text-sm shadow-md">📷</div>
      <div>
        <h1 class="text-xs font-bold tracking-tight">PPR Kameras Tilts</h1>
        <p id="targetRoomText" class="text-[10px] text-slate-400 font-mono">Pieslēdzas...</p>
      </div>
    </div>
    <div id="statusBadge" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-900 border border-slate-800 text-[11px] font-semibold text-slate-400 shadow-inner">
      <span id="statusDot" class="w-2 h-2 rounded-full bg-amber-500"></span>
      <span id="statusLabel">Savienojas...</span>
    </div>
  </header>

  <!-- Saturs -->
  <main class="flex-1 flex flex-col items-center justify-center my-6 space-y-5 text-center">
    <div class="w-24 h-24 rounded-3xl bg-slate-900 border border-slate-800 flex items-center justify-center text-4xl shadow-2xl relative">
      📄
      <span id="pingIndicator" class="hidden absolute -top-1 -right-1 w-3.5 h-3.5 bg-emerald-500 rounded-full animate-ping"></span>
    </div>
    <div class="space-y-1.5 px-4">
      <h2 class="text-lg font-bold text-slate-100">Fotografējiet pavadzīmi</h2>
      <p class="text-xs text-slate-400 leading-relaxed max-w-[280px]">Fotoattēli šifrētā kanālā nonāk datora rindā. Kad visas lapas uzņemtas, datorā nospiediet «Sākt apstrādi».</p>
    </div>

    <!-- Nosūtīto bilžu skaitītājs -->
    <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-2xl bg-indigo-950/60 border border-indigo-500/30 text-xs text-indigo-300">
      <span>Veiksmīgi nosūtīti:</span>
      <strong id="sentCount" class="font-mono text-white text-base">0</strong>
    </div>
  </main>

  <!-- Apakšējā poga -->
  <footer class="pb-4 space-y-3">
    <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden">

    <button id="shutterBtn" onclick="triggerCamera()" disabled class="w-full py-4 rounded-2xl bg-indigo-600 active:bg-indigo-700 disabled:bg-slate-800 disabled:text-slate-600 text-white font-bold text-base shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2.5 transition transform active:scale-95">
      <svg class="w-5 h-5 text-indigo-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
      <span id="shutterBtnText">Uzņemt pavadzīmes foto</span>
    </button>
  </footer>

  <script>
    let peer = null;
    let conn = null;
    let targetRoom = '';
    let sentCounter = 0;

    function getRoomFromUrl() {
      const hash = window.location.hash || '';
      const match = hash.match(/room=([^&]+)/);
      return match ? match[1] : '';
    }

    function setStatus(connected, label) {
      const dot = document.getElementById('statusDot');
      const text = document.getElementById('statusLabel');
      const btn = document.getElementById('shutterBtn');
      const ping = document.getElementById('pingIndicator');

      if (text) text.innerText = label;

      if (connected) {
        if (dot) dot.className = "w-2 h-2 rounded-full bg-emerald-500 animate-pulse";
        if (btn) btn.disabled = false;
        if (ping) ping.classList.remove('hidden');
      } else {
        if (dot) dot.className = "w-2 h-2 rounded-full bg-amber-500";
        if (btn) btn.disabled = true;
        if (ping) ping.classList.add('hidden');
      }
    }

    function initClientPeer() {
      targetRoom = getRoomFromUrl();
      const roomText = document.getElementById('targetRoomText');
      if (roomText) roomText.innerText = targetRoom ? `Istaba: ${targetRoom}` : 'Nav koda!';

      if (!targetRoom) {
        setStatus(false, 'Nav koda');
        alert('Lūdzu, noskenējiet QR kodu no datora ekrāna vēlreiz!');
        return;
      }

      if (peer && !peer.destroyed) {
        try { peer.destroy(); } catch (e) {}
      }

      peer = new Peer({ debug: 1 });

      peer.on('open', () => {
        connectToDesktop();
      });

      peer.on('error', (err) => {
        // AIZSARDZĪBA: Ja P2P kanāls ar datoru jau ir vaļā un strādā, ignorējam brokera brīdinājumus!
        if (conn && conn.open) {
          console.log('Ignorēts fona brīdinājums, jo P2P ir aktīvs:', err.type);
          return;
        }

        // Ja tas ir tikai fona savienojuma pārrāvums kameras dēļ, neuztraucam lietotāju ar "Kļūda"
        if (['network', 'lost-connection', 'socket-error', 'socket-closed'].includes(err.type)) {
          setStatus(false, 'Atjauno saikni...');
          setTimeout(connectToDesktop, 1200);
          return;
        }

        console.warn('Peer error:', err);
      });
    }

    function connectToDesktop() {
      if (!peer || peer.destroyed) return;

      conn = peer.connect(targetRoom, { reliable: true });

      conn.on('open', () => {
        setStatus(true, '✓ Savienots');
        if (navigator.vibrate) navigator.vibrate(80);
      });

      conn.on('data', (data) => {
        if (data && data.type === 'PPR_ACK') {
          sentCounter++;
          document.getElementById('sentCount').innerText = sentCounter;
          setStatus(true, '✓ Savienots');
          if (navigator.vibrate) navigator.vibrate([40, 60, 40]);
        }
      });

      conn.on('close', () => {
        setStatus(false, 'Savienojas...');
        setTimeout(connectToDesktop, 1500);
      });

      conn.on('error', (err) => {
        console.warn('Conn error', err);
      });
    }

    function triggerCamera() {
      document.getElementById('cameraInput').click();
    }

    // Zibenīga attēla samazināšana telefonā, lai WebRTC nepārpildītu buferi
    function compressMobileImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const MAX_DIM = 2560; // Optimālā izšķirtspēja precīzam EAN un tekstam
            let w = img.width;
            let h = img.height;
            if (w > MAX_DIM || h > MAX_DIM) {
              if (w > h) {
                h = Math.round((h * MAX_DIM) / w);
                w = MAX_DIM;
              } else {
                w = Math.round((w * MAX_DIM) / h);
                h = MAX_DIM;
              }
            }
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
            resolve(dataUrl.split(',')[1]);
          };
          img.onerror = () => reject(new Error('Neizdevās nolasīt attēlu'));
          img.src = e.target.result;
        };
        reader.onerror = () => reject(new Error('Faila lasīšanas kļūda'));
        reader.readAsDataURL(file);
      });
    }

    document.getElementById('cameraInput').addEventListener('change', async (e) => {
      const files = e.target.files;
      if (!files || files.length === 0) return;

      const file = files[0];
      const btn = document.getElementById('shutterBtn');
      const btnText = document.getElementById('shutterBtnText');

      btn.disabled = true;
      btnText.innerText = "Sūta uz datoru...";

      try {
        const base64Data = await compressMobileImage(file);

        if (conn && conn.open) {
          conn.send({
            type: 'PPR_IMAGE',
            name: file.name || `foto_${Date.now()}.jpg`,
            data: base64Data
          });
          btnText.innerText = "✓ Nosūtīts!";
          setStatus(true, '✓ Savienots');
        } else {
          throw new Error('Dators nav sasniedzams. Pārbaudiet savienojumu.');
        }
      } catch (err) {
        alert('Kļūda: ' + err.message);
        setStatus(false, 'Mēģina vēlreiz...');
      } finally {
        setTimeout(() => {
          btn.disabled = false;
          btnText.innerText = "Uzņemt nākamo foto";
          setStatus(true, '✓ Savienots');
        }, 1200);
      }

      e.target.value = '';
    });

    window.addEventListener('DOMContentLoaded', initClientPeer);
  </script>
</body>
</html>
