<!DOCTYPE html>
<html lang="lv" class="h-full bg-slate-950 text-white">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PPR Mobilā Kamera</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Hibrīda klienti: PeerJS (Lokālais Wi-Fi) + MQTT WSS (Mobilais 4G/GSM) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.3.5/mqtt.min.js"></script>
</head>
<body class="h-full flex flex-col justify-between p-4 selection:bg-indigo-500/20 antialiased font-sans">

  <!-- Galvene -->
  <header class="flex items-center justify-between pb-3 border-b border-slate-800">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-bold text-sm shadow-md">📷</div>
      <div>
        <h1 class="text-xs font-bold tracking-tight">PPR Kameras Tilts</h1>
        <p id="targetRoomText" class="text-[10px] text-slate-400 font-mono">Pieslēdzas...</p>
      </div>
    </div>
    <div id="statusBadge" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-900 border border-slate-800 text-[11px] font-semibold text-slate-400 shadow-inner">
      <span id="statusDot" class="w-2 h-2 rounded-full bg-amber-500"></span>
      <span id="statusLabel">Savienojas...</span>
    </div>
  </header>

  <!-- Saturs -->
  <main class="flex-1 flex flex-col items-center justify-center my-6 space-y-5 text-center">
    <div class="w-24 h-24 rounded-3xl bg-slate-900 border border-slate-800 flex items-center justify-center text-4xl shadow-2xl relative">
      📄
      <span id="pingIndicator" class="hidden absolute -top-1 -right-1 w-3.5 h-3.5 bg-emerald-500 rounded-full animate-ping"></span>
    </div>
    <div class="space-y-1.5 px-4">
      <h2 class="text-lg font-bold text-slate-100">Fotografējiet pavadzīmi</h2>
      <p class="text-xs text-slate-400 leading-relaxed max-w-[280px]">Fotoattēli uzreiz nonāk kases datora rindā. Kad visas lapas uzņemtas, datorā nospiediet «Sākt apstrādi».</p>
    </div>

    <!-- Nosūtīto bilžu skaitītājs -->
    <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-2xl bg-indigo-950/60 border border-indigo-500/30 text-xs text-indigo-300">
      <span>Veiksmīgi nosūtīti:</span>
      <strong id="sentCount" class="font-mono text-white text-base">0</strong>
    </div>
  </main>

  <!-- Apakšējā poga -->
  <footer class="pb-4 space-y-3">
    <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden">

    <button id="shutterBtn" onclick="triggerCamera()" disabled class="w-full py-4 rounded-2xl bg-indigo-600 active:bg-indigo-700 disabled:bg-slate-800 disabled:text-slate-600 text-white font-bold text-base shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2.5 transition transform active:scale-95">
      <svg class="w-5 h-5 text-indigo-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
      <span id="shutterBtnText">Uzņemt pavadzīmes foto</span>
    </button>
  </footer>

  <script>
    let targetRoom = '';
    let sentCounter = 0;

    // Wi-Fi P2P mainīgie
    let p2pPeer = null;
    let p2pConn = null;

    // GSM WSS mainīgie
    let mqttClient = null;
    let pingInterval = null;

    function getRoomFromUrl() {
      const hash = window.location.hash || '';
      const match = hash.match(/room=([^&]+)/);
      return match ? match[1] : '';
    }

    function setStatus(connected, label) {
      const dot = document.getElementById('statusDot');
      const text = document.getElementById('statusLabel');
      const btn = document.getElementById('shutterBtn');
      const ping = document.getElementById('pingIndicator');

      if (text) text.innerText = label;

      if (connected) {
        if (dot) dot.className = "w-2 h-2 rounded-full bg-emerald-500 animate-pulse";
        if (btn) btn.disabled = false;
        if (ping) ping.classList.remove('hidden');
      } else {
        if (dot) dot.className = "w-2 h-2 rounded-full bg-amber-500";
        if (btn) btn.disabled = true;
        if (ping) ping.classList.add('hidden');
      }
    }

    function initHybridClient() {
      targetRoom = getRoomFromUrl();
      const roomText = document.getElementById('targetRoomText');
      if (roomText) roomText.innerText = targetRoom ? `Istaba: ${targetRoom}` : 'Nav koda!';

      if (!targetRoom) {
        setStatus(false, 'Nav koda');
        alert('Lūdzu, atveriet saiti ar veikala kodu (piem., #room=ppr-vilani) vai noskenējiet QR kodu!');
        return;
      }

      setStatus(false, 'Savienojas...');

      // 1. Mēģinām lokālo Wi-Fi P2P (PeerJS)
      initLocalP2PClient();

      // 2. Vienlaikus pieslēdzam GSM WSS (MQTT) kā nepārtrauktu drošības kanālu
      initGsmMqttClient();
    }

    function initLocalP2PClient() {
      if (p2pPeer && !p2pPeer.destroyed) {
        try { p2pPeer.destroy(); } catch (e) {}
      }

      p2pPeer = new Peer({ debug: 1 });

      p2pPeer.on('open', () => {
        connectP2P();
      });

      p2pPeer.on('error', () => {
        // Klusi ignorējam, ja esam 4G tīklā, jo paralēli strādā GSM MQTT
      });
    }

    function connectP2P() {
      if (!p2pPeer || p2pPeer.destroyed) return;
      p2pConn = p2pPeer.connect(targetRoom, { reliable: true });

      p2pConn.on('open', () => {
        setStatus(true, '✓ Savienots (Wi-Fi lokāli)');
      });

      p2pConn.on('data', (data) => {
        if (data && data.type === 'PPR_ACK') {
          sentCounter++;
          document.getElementById('sentCount').innerText = sentCounter;
          setStatus(true, '✓ Savienots (Wi-Fi lokāli)');
          if (navigator.vibrate) navigator.vibrate([40, 60, 40]);
        }
      });

      p2pConn.on('close', () => {
        p2pConn = null;
        checkCurrentStatus();
      });
    }

    function initGsmMqttClient() {
      if (mqttClient) {
        try { mqttClient.end(true); } catch (e) {}
      }

      const primaryBroker = 'wss://broker.hivemq.com:8884/mqtt';
      const fallbackBroker = 'wss://broker.emqx.io:8084/mqtt';
      const clientId = 'ppr_cam_' + Math.random().toString(36).substring(2, 9);
      let isFallback = false;

      function connect(brokerUrl) {
        const c = mqtt.connect(brokerUrl, {
          clientId: clientId,
          clean: true,
          connectTimeout: 6000,
          reconnectPeriod: 2500
        });

        c.on('connect', () => {
          const pongTopic = `ppr2026/${targetRoom}/pong`;
          const ackTopic = `ppr2026/${targetRoom}/ack`;

          c.subscribe([pongTopic, ackTopic], (err) => {
            if (!err) {
              sendMqttPing();
              clearInterval(pingInterval);
              pingInterval = setInterval(sendMqttPing, 3500);
            }
          });
        });

        c.on('message', (topic) => {
          if (topic.endsWith('/pong')) {
            if (!p2pConn || !p2pConn.open) {
              setStatus(true, '✓ Savienots (GSM 4G)');
            }
          }

          if (topic.endsWith('/ack')) {
            sentCounter++;
            document.getElementById('sentCount').innerText = sentCounter;
            checkCurrentStatus();
            if (navigator.vibrate) navigator.vibrate([40, 60, 40]);
          }
        });

        c.on('error', () => {
          if (!isFallback) {
            isFallback = true;
            try { c.end(true); } catch (e) {}
            connect(fallbackBroker);
          }
        });

        c.on('close', () => {
          checkCurrentStatus();
        });

        return c;
      }

      mqttClient = connect(primaryBroker);
    }

    function sendMqttPing() {
      if (mqttClient && mqttClient.connected) {
        mqttClient.publish(`ppr2026/${targetRoom}/ping`, JSON.stringify({ ping: true, time: Date.now() }));
      }
    }

    function checkCurrentStatus() {
      if (p2pConn && p2pConn.open) {
        setStatus(true, '✓ Savienots (Wi-Fi lokāli)');
      } else if (mqttClient && mqttClient.connected) {
        setStatus(true, '✓ Savienots (GSM 4G)');
      } else {
        setStatus(false, 'Savienojas...');
      }
    }

    function triggerCamera() {
      document.getElementById('cameraInput').click();
    }

    function compressMobileImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const MAX_DIM = 2200;
            let w = img.width;
            let h = img.height;
            if (w > MAX_DIM || h > MAX_DIM) {
              if (w > h) {
                h = Math.round((h * MAX_DIM) / w);
                w = MAX_DIM;
              } else {
                w = Math.round((w * MAX_DIM) / h);
                h = MAX_DIM;
              }
            }
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
            resolve(dataUrl.split(',')[1]);
          };
          img.onerror = () => reject(new Error('Neizdevās nolasīt fotoattēlu'));
          img.src = e.target.result;
        };
        reader.onerror = () => reject(new Error('Faila lasīšanas kļūda'));
        reader.readAsDataURL(file);
      });
    }

    // Pārliecinās, ka sakari ir aktīvi pirms nosūtīšanas
    function ensureReadyConnection(timeoutMs = 7000) {
      return new Promise((resolve, reject) => {
        if ((p2pConn && p2pConn.open) || (mqttClient && mqttClient.connected)) {
          return resolve();
        }

        if (mqttClient) {
          try { mqttClient.reconnect(); } catch (e) {}
        }
        sendMqttPing();

        const start = Date.now();
        const t = setInterval(() => {
          if ((p2pConn && p2pConn.open) || (mqttClient && mqttClient.connected)) {
            clearInterval(t);
            return resolve();
          }
          if (Date.now() - start > timeoutMs) {
            clearInterval(t);
            reject(new Error("Neizdevās atjaunot savienojumu ar datoru. Pārbaudiet tīklu!"));
          }
        }, 150);
      });
    }

    async function sendImageViaGsmChunks(fileName, base64Data, onProgress) {
      const CHUNK_SIZE = 55 * 1024; // 55 KB
      const totalChunks = Math.ceil(base64Data.length / CHUNK_SIZE);
      const transferId = 'tr_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6);

      for (let i = 0; i < totalChunks; i++) {
        const start = i * CHUNK_SIZE;
        const end = Math.min(start + CHUNK_SIZE, base64Data.length);
        const chunkStr = base64Data.substring(start, end);

        const payload = JSON.stringify({
          id: transferId,
          name: fileName || `foto_${Date.now()}.jpg`,
          idx: i,
          total: totalChunks,
          chunk: chunkStr
        });

        mqttClient.publish(`ppr2026/${targetRoom}/chunk`, payload, { qos: 0 });
        if (onProgress) onProgress(i + 1, totalChunks);

        if (i < totalChunks - 1) {
          await new Promise(r => setTimeout(r, 35));
        }
      }
    }

    document.getElementById('cameraInput').addEventListener('change', async (e) => {
      const files = e.target.files;
      if (!files || files.length === 0) return;

      const file = files[0];
      const btn = document.getElementById('shutterBtn');
      const btnText = document.getElementById('shutterBtnText');

      btn.disabled = true;
      btnText.innerText = "Apstrādā fotoattēlu...";

      try {
        const base64Data = await compressMobileImage(file);

        btnText.innerText = "Pārbauda savienojumu...";
        await ensureReadyConnection(7000);

        // 1. Izvēle: Ja aktīvs Wi-Fi P2P, sūtam pa tiešo caur lokālo tīklu
        if (p2pConn && p2pConn.open) {
          btnText.innerText = "Sūta pa lokālo Wi-Fi...";
          p2pConn.send({
            type: 'PPR_IMAGE',
            name: file.name || `foto_${Date.now()}.jpg`,
            data: base64Data
          });
        } 
        // 2. Izvēle: Ja esam 4G/GSM tīklā, sūtam pa drošajiem WSS gabaliņiem
        else if (mqttClient && mqttClient.connected) {
          btnText.innerText = "Sūta pa GSM tīklu...";
          await sendImageViaGsmChunks(file.name, base64Data, (sent, total) => {
            btnText.innerText = `Sūta GSM (${sent}/${total})...`;
          });
        } else {
          throw new Error("Nav savienojuma ar kases datoru!");
        }

        btnText.innerText = "✓ Nosūtīts!";
        checkCurrentStatus();
      } catch (err) {
        console.error(err);
        alert('Kļūda nosūtot: ' + err.message);
        checkCurrentStatus();
      } finally {
        setTimeout(() => {
          btn.disabled = false;
          btnText.innerText = "Uzņemt nākamo foto";
          checkCurrentStatus();
        }, 1400);
        e.target.value = '';
      }
    });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        sendMqttPing();
        if (!p2pConn || !p2pConn.open) {
          connectP2P();
        }
      }
    });

    window.addEventListener('DOMContentLoaded', initHybridClient);
  </script>
</body>
</html>
